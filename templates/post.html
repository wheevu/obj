<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{entry.title}} / {{site.title}}</title>
<link rel="stylesheet" href="{{base}}static/style.css">
</head>
<body>
<header class="site-head">
  <a class="brand" href="{{base}}index.html">obj</a>
  <nav class="nav">
    <a href="{{base}}archive.html">archive</a>
    <a href="{{base}}rss.xml">rss</a>
  </nav>
</header>

<main class="post">
  <h1 class="post-title">{{entry.title}}</h1>
  <p class="post-date">{{entry.date}}</p>
  {{#entry.description}}
  <p class="description">{{entry.description}}</p>
  {{/entry.description}}

  <article class="body">
    {{{entry.body_html}}}
  </article>

  <p class="tags">
    {{#entry.tags}}<a class="tag" href="{{base}}{{href}}">{{label}}</a> {{/entry.tags}}
  </p>

  <nav class="pager">
    {{#prev}}
    <a class="prev" href="{{base}}{{href}}">&larr; {{title}}</a>
    {{/prev}}
    {{#next}}
    <a class="next" href="{{base}}{{href}}">{{title}} &rarr;</a>
    {{/next}}
  </nav>
</main>

<footer class="site-foot">
  {{site.title}} &mdash; things I decided to keep.
</footer>
</body>
</html>
