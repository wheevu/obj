<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tag: {{tag}} / {{site.title}}</title>
<link rel="stylesheet" href="{{base}}static/style.css">
</head>
<body>
<header class="site-head">
  <a class="brand" href="{{base}}index.html">obj</a>
  <nav class="nav">
    <a href="{{base}}archive.html">archive</a>
    <a href="{{base}}rss.xml">rss</a>
  </nav>
</header>

<main class="tag">
  <h1 class="page-title">tag: {{tag}}</h1>
  <p class="stat">{{tag_count}} posts with this tag.</p>

  <section class="block">
    <ul class="rows">
    {{#entries}}
      <li>
        <a class="title" href="{{base}}{{href}}">{{title}}</a>
        <span class="date">{{date}}</span>
      </li>
    {{/entries}}
    </ul>
  </section>
</main>

<footer class="site-foot">
  {{site.title}} &mdash; things I decided to keep.
</footer>
</body>
</html>
